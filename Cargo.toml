[package]
name = "daily-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = "0.30"
ratatui-bubbletea-components = "0.2"
ratatui-bubbletea-theme = "0.2"
ratatui-tea = "0.2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
